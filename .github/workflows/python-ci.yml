# Python CI Workflow for FastAPI Backend
# Tests Python code, linting, and type checking

name: Python CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'apps/api-ai/**'
      - 'requirements*.txt'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'apps/api-ai/**'
      - 'requirements*.txt'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core dependencies (excluding heavy OCR deps for CI)
          pip install fastapi uvicorn pydantic pydantic-settings python-dotenv
          pip install python-multipart python-jose passlib asyncpg redis
          pip install openai langchain langchain-openai tiktoken httpx aiofiles
          pip install python-json-logger python-dateutil
          # Install development dependencies
          pip install pytest pytest-cov pytest-asyncio flake8 black mypy

      - name: Lint with flake8
        run: |
          flake8 apps/api-ai --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 apps/api-ai --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code style with black
        run: black --check apps/api-ai

      - name: Type check with mypy
        run: mypy apps/api-ai --ignore-missing-imports --check-untyped-defs

      - name: Run tests with pytest
        run: |
          cd apps/api-ai
          pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing -v || echo "⚠️ No tests found yet"
